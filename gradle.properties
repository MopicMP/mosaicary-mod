# Memory, the same as the sibling mods because the machine is the same one.
#
# Loom holds the whole Minecraft jar on the heap while it builds, and one gigabyte
# is not enough for that. Performance flags are only worth adding together with a
# measurement on this project, and the one here has its own:
#
# The serial collector. With the default one (G1) the daemon took 1.76 GB of heap
# from the system for 0.5 GB of live data: on two cores it keeps up by growing the
# heap. Measured with tools/measure-build.sh, one project built from scratch
# (`:1.21.11-fabric:build --rerun-tasks`, 2026-11-04), with `-Pnodes` as well:
# 1 min 30 s instead of 1 min 53, swap grew by 54 MB instead of 1.5 GB, the
# machine stalled for memory at most 6 percent of the time instead of 21.
org.gradle.jvmargs=-Xmx3G -XX:+UseSerialGC
# One project at a time: two at once do not fit beside the game and a browser in six gigabytes,
# and the machine has two cores, so they would not be done sooner either.
org.gradle.parallel=false
# The daemon keeps its heap for three hours after a build by default; here it leaves after ten
# idle minutes, and the next build starts a new one.
org.gradle.daemon.idletimeout=600000
org.gradle.configuration-cache=false

# What the game itself is allowed, used by the client runs in build.gradle.kts.
#
# Two clients and a server must fit at once on a six-gigabyte machine, so each
# client gets one gigabyte at most.
client_heap_min=512M
client_heap_max=1G

# Mod properties.
mod_version=1.0.4
maven_group=com.mopicmp.mosaicary

# The WebP decoder for the catalogue's preview pictures. See build.gradle.kts.
webp_version=3.12.0

# Which game, loader and dependency versions each project uses is in versions/<project>/gradle.properties.

# The revision of essential-gradle-toolkit's defaults (game, loader and mapping versions per project),
# pinned so that the build does not change when the toolkit's defaults do.
essential.defaults.loom=0
