# Memory, the same as the sibling mods because the machine is the same one.
#
# Loom holds the whole Minecraft jar on the heap while it builds, and one gigabyte
# is not enough for that. Nothing beyond -Xmx is set here: performance flags are
# only worth adding together with a measurement on this project.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# What the game itself is allowed, used by the client runs in build.gradle.kts.
#
# Two clients and a server must fit at once on a six-gigabyte machine, so each
# client gets one gigabyte at most.
client_heap_min=512M
client_heap_max=1G

# Mod properties.
mod_version=1.0.3
maven_group=com.mopicmp.mosaicary

# The WebP decoder for the catalogue's preview pictures. See build.gradle.kts.
webp_version=3.12.0

# Which game, loader and dependency versions each project uses is in versions/<project>/gradle.properties.

# The revision of essential-gradle-toolkit's defaults (game, loader and mapping versions per project),
# pinned so that the build does not change when the toolkit's defaults do.
essential.defaults.loom=0
