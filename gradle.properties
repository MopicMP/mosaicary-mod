# Memory, the same as the sibling mods because the machine is the same one.
#
# Loom holds the whole Minecraft jar on the heap while it builds, and one gigabyte
# is not enough for that. Nothing beyond -Xmx is set here: performance flags are
# only worth adding together with a measurement on this project.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# What the game itself is allowed, used by the client runs in build.gradle.
#
# Two clients and a server must fit at once on a six-gigabyte machine, so each
# client gets one gigabyte at most.
client_heap_min=512M
client_heap_max=1G

org.gradle.configuration-cache=false

# Fabric properties.
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.4

# Mod properties
mod_version=1.0.0
maven_group=com.mopicmp.mosaicary

# Dependencies
fabric_api_version=0.162.0+26.3

# The WebP decoder for the catalogue's preview pictures. See build.gradle.
webp_version=3.12.0

# Mod Menu, compiled against for the "Configure" button only. See build.gradle.
modmenu_version=21.0.0
