plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	// Mod Menu, for its "Configure" button (client/compat/ModMenuEntry); compiled against only.
	maven { url = "https://maven.terraformersmc.com/releases/" }
}

// Two source sets.
//
// `main` is the common half: it loads on clients and on servers. It is almost
// empty for now and is where an optional server part will go, one that relays
// worn models between players as packets when the server has the mod.
//
// `client` is everything else: the catalogue, the site client, the model reader
// and the renderer. The client must work fully on a server that does not have
// the mod at all, so nothing in `client` may depend on the server half answering.
loom {
	splitEnvironmentSourceSets()

	mods {
		"mosaicary" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// ---------------------------------------------------------------------------
	// Two clients and a server with the mod.
	//
	// Each client has its own run directory, because both write options, logs and
	// the mod's cache to disk, and its own name, because a development server has
	// no Microsoft session to tell two players apart by.
	// ---------------------------------------------------------------------------
	runs {
		client {
			client()
			configName = "Client - Alice"
			runDir "run"
			programArgs "--username", "Alice"
			vmArgs "-Xms${project.client_heap_min}", "-Xmx${project.client_heap_max}"
		}

		client2 {
			client()
			configName = "Client - Bob"
			runDir "run2"
			programArgs "--username", "Bob"
			vmArgs "-Xms${project.client_heap_min}", "-Xmx${project.client_heap_max}"
		}

		server {
			server()
			configName = "Server with the mod"
			runDir "run-server"
			vmArgs "-Xms1G", "-Xmx1G"
		}

		// The visual check: opens the catalogue at startup, takes a screenshot of
		// the grid and of one detail view once the previews have loaded, writes
		// them to tmp/mosaicary-shots at the repository root, and quits.
		shots {
			client()
			configName = "Client - screenshots"
			runDir "run"
			// Large enough for GUI scale 4; the game caps the scale by the window size.
			programArgs "--username", "Alice", "--width", "1920", "--height", "1080"
			vmArgs "-Xms${project.client_heap_min}", "-Xmx${project.client_heap_max}",
				"-Dmosaicary.shots=${rootProject.projectDir.parentFile.absolutePath}/tmp/mosaicary-shots"
			// `-PshotsScales=2,3,4` repeats the round at each GUI scale;
			// `-PshotsModel=<id>` photographs only that model's detail view.
			if (project.hasProperty('shotsScales')) vmArg "-Dmosaicary.shotsScales=${project.property('shotsScales')}"
			if (project.hasProperty('shotsModel')) vmArg "-Dmosaicary.shotsModel=${project.property('shotsModel')}"
			// `-PshotsFrames=rest@0,post@0.25` adds a paused frame of each named animation.
			if (project.hasProperty('shotsFrames')) vmArg "-Dmosaicary.shotsFrames=${project.property('shotsFrames')}"
			// `-PshotsView=blockbench` shows those frames from Blockbench's opening angle.
			if (project.hasProperty('shotsView')) vmArg "-Dmosaicary.shotsView=${project.property('shotsView')}"
		}
	}
}

// A client game test (`gradlew runClientGameTest`): starts the game, creates a world
// and drives the catalogue with real key presses and mouse input through Fabric's
// client game test API, taking screenshots on the way. It checks what the
// screenshot run cannot: the key, the pause menu button and dragging the preview.
// The test mod lives in src/gametest and is not part of the released jar.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "mosaicary-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
		clearRunDirectory = true
		username = "Alice"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu's interface, to open the settings from its list of mods. Not shipped and not
	// required: the entry point is only loaded when Mod Menu is there.
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// A WebP decoder, for the preview pictures the site serves.
	//
	// The site stores every card picture as WebP, and the game's own decoder
	// (stb_image) reads PNG, JPEG, GIF and BMP but not WebP. TwelveMonkeys is pure
	// Java, so one jar works on every platform; the same decoder is already in use
	// in the NPC Studio mod next to this one.
	clientImplementation "com.twelvemonkeys.imageio:imageio-webp:${project.webp_version}"
	// Listed one by one because jar-in-jar does not follow transitive
	// dependencies, and a decoder missing half of itself would only fail when the
	// catalogue is opened.
	include "com.twelvemonkeys.imageio:imageio-webp:${project.webp_version}"
	include "com.twelvemonkeys.imageio:imageio-core:${project.webp_version}"
	// The WebP reader's own pom lists this one too; leaving it out of the jar
	// would only show when a picture with metadata is read.
	include "com.twelvemonkeys.imageio:imageio-metadata:${project.webp_version}"
	include "com.twelvemonkeys.common:common-lang:${project.webp_version}"
	include "com.twelvemonkeys.common:common-io:${project.webp_version}"
	include "com.twelvemonkeys.common:common-image:${project.webp_version}"

	// The model reader and the site client have no Minecraft types in them, so
	// they are checked with plain JUnit and no game running.
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The tested code lives in the client source set, so its output and class path
// go on the tests' class path.
sourceSets {
	test {
		compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
		runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output
	}
	gametest {
		compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
		runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// Models downloaded from the live site for testing live in tmp/ at the
	// repository root and never in this project. Tests that need them skip
	// themselves when the folder is absent.
	systemProperty 'mosaicary.liveModels',
		"${rootProject.projectDir.parentFile.absolutePath}/tmp/mosaicary-live"
	// Builds (Litematica, WorldEdit and Axiom samples, and what the site wrote from them)
	// are in tmp/ too; see BuildsTest.
	systemProperty 'mosaicary.tmp', "${rootProject.projectDir.parentFile.absolutePath}/tmp"
	// `gradlew test -PsiteLive` also runs read-only requests against mosaicary.com.
	if (project.hasProperty('siteLive')) systemProperty 'mosaicary.siteLive', 'true'
	outputs.upToDateWhen { !project.hasProperty('siteLive') }
	testLogging {
		events 'passed', 'failed', 'skipped'
		exceptionFormat 'full'
		showStandardStreams = true
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'

	// The compiler runs in a worker with its own heap, smaller than the daemon's.
	// Compiling against the whole Minecraft jar exhausts the default, and the
	// failure says "worker daemon finished with non-zero exit value" without
	// mentioning memory.
	it.options.forkOptions.memoryMaximumSize = '2g'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Other mods for a game test run, without adding them to the mod's dependencies: a folder of
// jars (`-PtestMods=/path`, read by Fabric Loader as fabric.addMods) and resource packs the test
// puts in the run's folder (`-PtestPacks=/path`). For checking the Mod Menu button and live eyes
// with Entity Model Features, Entity Texture Features and Fresh Moves+.
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
	if (project.hasProperty('testMods')) jvmArgs "-Dfabric.addMods=${project.property('testMods')}"
	if (project.hasProperty('testPacks')) jvmArgs "-Dmosaicary.testPacks=${project.property('testPacks')}"
	if (project.hasProperty('testSearch')) jvmArgs "-Dmosaicary.testSearch=${project.property('testSearch')}"
	if (project.hasProperty('testLanguages')) jvmArgs "-Dmosaicary.testLanguages=true"
	if (project.hasProperty('testSite')) jvmArgs "-Dmosaicary.testSite=${project.property('testSite')}", "-Dmosaicary.testSiteKey=${project.property('testSiteKey')}"
}

